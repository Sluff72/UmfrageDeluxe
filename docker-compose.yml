services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3029:3029"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DATABASE_PATH=/data/umfrage.db
      - CORS_ORIGIN=http://localhost:3030
      - PORT=3029
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-}
    volumes:
      - sqlite-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3029/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3029
        - NEXT_PUBLIC_WS_URL=ws://localhost:3029
    ports:
      - "3030:3030"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data:
